name = "slint-releases"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The content. Both buckets hold every name in lowercase; see scripts/upload.sh.
[[r2_buckets]]
binding     = "RELEASES"
bucket_name = "slint-releases"

[[r2_buckets]]
binding     = "SNAPSHOTS"
bucket_name = "slint-snapshots"

# The current release, which docs.slint.dev serves instead. CI overrides this
# with the first line of releases/versions.txt:
#   wrangler deploy --var LATEST_RELEASE:$version
[vars]
LATEST_RELEASE = "1.17.1"

# Routes, not custom domains. Both names already have DNS records pointing at
# Netlify, and a custom domain would replace them -- and is refused outright on
# a name that already has a CNAME. A route leaves DNS alone and puts the worker
# in front of whatever the record points at, so backing out is deleting the
# route: traffic falls through to Netlify again with nothing to rebuild.
#
# Requires both names to be proxied, which they are.
[[routes]]
pattern   = "releases.slint.dev/*"
zone_name = "slint.dev"

[[routes]]
pattern   = "snapshots.slint.dev/*"
zone_name = "slint.dev"

# A second copy on throwaway names, for checking a deploy before the real ones
# are switched over. Deploy with: wrangler deploy --env staging
[env.staging]
name = "slint-releases-staging"

[[env.staging.r2_buckets]]
binding     = "RELEASES"
bucket_name = "slint-releases"

[[env.staging.r2_buckets]]
binding     = "SNAPSHOTS"
bucket_name = "slint-snapshots"

[env.staging.vars]
LATEST_RELEASE = "1.17.1"

[[env.staging.routes]]
pattern       = "releases-test.slint.dev"
custom_domain = true

[[env.staging.routes]]
pattern       = "snapshots-test.slint.dev"
custom_domain = true
