name: CI

on:
  # master only. Deploying attaches releases.slint.dev and snapshots.slint.dev
  # to the worker, which rewrites those DNS records — so a push to any branch
  # would put that branch live.
  push:
    branches:
      - master

jobs:
  files-changed:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.filter.outputs.releases }}
      snapshots: ${{ steps.filter.outputs.snapshots }}
      slintpad: ${{ steps.filter.outputs.slintpad }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            releases:
              - 'releases/**'
              - 'scripts/upload.sh'
            snapshots:
              - 'snapshots/**'
              - 'scripts/upload.sh'
            slintpad:
              - 'slintpad/**'
            worker:
              - 'worker/**'

  deploy-releases:
    needs: files-changed
    if: needs.files-changed.outputs.releases == 'true'
    uses: ./.github/workflows/deploy-releases.yml
    secrets: inherit

  deploy-snapshots:
    needs: files-changed
    if: needs.files-changed.outputs.snapshots == 'true'
    uses: ./.github/workflows/deploy-snapshots.yml
    secrets: inherit

  # Only when the worker changed on its own. A release deploys it from inside
  # deploy-releases.yml, and running both would queue two deploys against the
  # same concurrency group: one cancels the other and the whole run is reported
  # as cancelled, even though the worker went out fine.
  deploy-worker:
    needs: files-changed
    if: >-
      needs.files-changed.outputs.worker == 'true' &&
      needs.files-changed.outputs.releases != 'true'
    uses: ./.github/workflows/deploy-worker.yml
    secrets: inherit

  deploy-slintpad:
    needs: files-changed
    if: needs.files-changed.outputs.slintpad == 'true'
    uses: ./.github/workflows/deploy-slintpad.yml
    secrets: inherit
