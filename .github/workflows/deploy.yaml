name: CI

on:
  # master only. Deploying attaches releases.slint.dev and snapshots.slint.dev
  # to the worker, which rewrites those DNS records — so a push to any branch
  # would put that branch live.
  push:
    branches:
      - master

jobs:
  files-changed:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.filter.outputs.releases }}
      snapshots: ${{ steps.filter.outputs.snapshots }}
      slintpad: ${{ steps.filter.outputs.slintpad }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            releases:
              - 'releases/**'
              - 'scripts/upload.sh'
            snapshots:
              - 'snapshots/**'
              - 'scripts/upload.sh'
            slintpad:
              - 'slintpad/**'
            worker:
              - 'worker/**'

  deploy-releases:
    needs: files-changed
    if: needs.files-changed.outputs.releases == 'true'
    uses: ./.github/workflows/deploy-releases.yml
    secrets: inherit

  deploy-snapshots:
    needs: files-changed
    if: needs.files-changed.outputs.snapshots == 'true'
    uses: ./.github/workflows/deploy-snapshots.yml
    secrets: inherit

  # A release also redeploys the worker, from within deploy-releases.yml. This
  # covers a change to the worker on its own.
  deploy-worker:
    needs: files-changed
    if: needs.files-changed.outputs.worker == 'true'
    uses: ./.github/workflows/deploy-worker.yml
    secrets: inherit

  deploy-slintpad:
    needs: files-changed
    if: needs.files-changed.outputs.slintpad == 'true'
    uses: ./.github/workflows/deploy-slintpad.yml
    secrets: inherit
